name: Build and Deploy iOS to TestFlight

on:
  workflow_dispatch:
    inputs:
      skip_testflight_upload:
        description: "Build IPA only without uploading to TestFlight"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*"

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy_ios:
    name: Build & Upload to TestFlight
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Initialize JUCE submodule (shallow)
        run: |
          git submodule update --init --depth 1 JUCE

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies, build UI assets, and run unit tests
        run: |
          npm --prefix ui ci
          npm --prefix ui run build
          npm --prefix ui test

      - name: Configure iOS Xcode project via CMake
        run: |
          cmake -B build_ios -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0

      - name: Setup Ruby and Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Cache Xcode DerivedData
        uses: actions/cache@v4
        with:
          path: DerivedData
          key: ${{ runner.os }}-xcode-deriveddata-${{ hashFiles('CMakeLists.txt', 'Source/**') }}
          restore-keys: |
            ${{ runner.os }}-xcode-deriveddata-

      - name: Build and Upload to TestFlight via Fastlane
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || 'MX8BPUQ84Q' }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          SKIP_TESTFLIGHT_UPLOAD: ${{ inputs.skip_testflight_upload || 'false' }}
        run: |
          bundle exec fastlane ios beta

      - name: Upload IPA Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iOS-App-IPA
          path: build/ios/*.ipa
          if-no-files-found: ignore
